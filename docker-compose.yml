# Freelancezero — one-command local/self-hosted stack.
#   docker compose up -d
#
# Services:
#   db      — PostgreSQL 16
#   mailhog — local SMTP inbox for testing emails (UI on :8025)
#   app     — the Next.js application
#
# For production, put this behind a reverse proxy (Caddy/Traefik) with TLS.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freelancezero
      POSTGRES_PASSWORD: freelancezero
      POSTGRES_DB: freelancezero
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freelancezero']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://freelancezero:freelancezero@db:5432/freelancezero?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me-in-production}
      AUTH_TRUST_HOST: 'true'
      EMAIL_SERVER_HOST: mailhog
      EMAIL_SERVER_PORT: '1025'
      EMAIL_FROM: 'Freelancezero <no-reply@freelancezero.com>'
      STORAGE_DRIVER: local
      REALTIME_DRIVER: none
      SEARCH_DRIVER: postgres
      PAYMENTS_DRIVER: manual
    ports:
      - '3000:3000'
    # Run migrations then start the server.
    command: sh -c "npx prisma migrate deploy && node server.js"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
