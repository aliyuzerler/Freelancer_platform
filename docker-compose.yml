# Freelancezero — one-command local/self-hosted stack.
#   cp .env.example .env   # set AUTH_SECRET (and POSTGRES_PASSWORD)
#   docker compose up -d
#
# Services:
#   db      — PostgreSQL 16 (NOT exposed to the host; reach it via the app or
#             `docker compose exec db psql`)
#   mailhog — local SMTP inbox for testing emails (UI on 127.0.0.1:8025)
#   app     — the Next.js application (127.0.0.1:3000; put Caddy/Traefik with
#             TLS in front for production)
#
# FZ-19 hardening notes:
#   - No default credentials: POSTGRES_PASSWORD and AUTH_SECRET are REQUIRED
#     from .env (compose refuses to start with them unset).
#   - The database is not published to the host network at all — only the app
#     service can reach it over the compose network.
#   - Mailhog and the app bind to 127.0.0.1 so nothing is accidentally public.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freelancezero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (e.g. openssl rand -hex 16)}
      POSTGRES_DB: freelancezero
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freelancezero']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # web UI

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://freelancezero:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/freelancezero?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
      AUTH_TRUST_HOST: 'true'
      EMAIL_SERVER_HOST: mailhog
      EMAIL_SERVER_PORT: '1025'
      EMAIL_FROM: 'Freelancezero <no-reply@freelancezero.com>'
      STORAGE_DRIVER: local
      REALTIME_DRIVER: none
      SEARCH_DRIVER: postgres
      PAYMENTS_DRIVER: manual
    ports:
      - '127.0.0.1:3000:3000'
    # Run migrations then start the server.
    command: sh -c "npx prisma migrate deploy && node server.js"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
